version: "3.8"

name: hey_professor
services:
    app:
        container_name: hey_professor
        build:
            context: ..
            dockerfile: ./docker/Dockerfile
        image: hey_professor-api
        restart: unless-stopped
        working_dir: /var/www/
        volumes:
            - ../:/var/www
        depends_on:
            - redis
        networks:
            - heyProfessor

    nginx:
        container_name: hey_professor-nginx
        image: nginx:alpine
        restart: unless-stopped
        ports:
            - "8081:80"
        volumes:
            - ../:/var/www
            - ../docker/nginx/laravel.conf:/etc/nginx/conf.d/default.conf
        networks:
            - heyProfessor

    postgres:
        container_name: hey_professor_database
        image: postgres
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: 2291755cd2@
            PGDATA: /data/postgres
        volumes:
            - ../postgres:/data/postgres
        ports:
            - "5432:5432"
        networks:
            - heyProfessor
        restart: unless-stopped

    queue:
        build:
            context: ..
            dockerfile: ./docker/Dockerfile-queue
        container_name: hey_professor_queue
        image: hey_professor_queue
        restart: unless-stopped
        command: "php artisan queue:work"
        volumes:
            - ../:/var/www
        depends_on:
            - redis
            - app
        networks:
            - heyProfessor

    # redis
    redis:
        container_name: hey_professor_redis
        image: redis:latest
        ports:
            - "6379:6379"
        restart: always
        networks:
            - heyProfessor

networks:
    heyProfessor:
        driver: bridge
